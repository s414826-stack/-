<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>攝影教室器材借用系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-10">

<script>
  // ====== 請在此貼上你的 Google Apps Script 網頁應用程式網址 ======
  const API_URL = "https://script.google.com/macros/s/AKfycbyuJrwdFh75-KG2BzqUqETcOLqQ9Yz3XjnGnlWFSpg_QU05zrofmNAuxRkwUnEPGREy/exec";
</script>

<!-- 頂部導覽列 -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
    <h1 class="font-bold text-lg text-slate-900 tracking-tight">攝影教室器材借用</h1>
    <nav class="hidden md:flex gap-2">
      <button onclick="switchTab('apply')" id="nav-d-apply" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white">借用申請</button>
      <button onclick="switchTab('status')" id="nav-d-status" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">我的進度與取件</button>
      <button onclick="switchTab('return')" id="nav-d-return" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">歸還與回報</button>
    </nav>
  </div>
</header>

<!-- Toast 提示 -->
<div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium text-white transition-all"></div>

<main class="max-w-5xl mx-auto px-4 pt-5">

  <!-- ==================== 頁籤 1：借用申請 ==================== -->
  <section id="tab-apply">
    <div class="flex flex-col sm:flex-row gap-3 mb-5">
      <div id="category-bar" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
      <input id="search-input" oninput="renderCatalog()" type="text" placeholder="搜尋器材名稱..."
        class="sm:ml-auto w-full sm:w-56 px-3 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div id="catalog-loading" class="text-center py-16 text-slate-400 text-sm">載入器材清單中...</div>
    <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3.5"></div>
  </section>

  <!-- ==================== 頁籤 2：我的進度與取件拍照 ==================== -->
  <section id="tab-status" class="hidden">
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-5">
      <h2 class="font-bold text-base mb-3">查詢我的借用進度</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <input id="q-sid" type="text" placeholder="輸入學號" class="px-3 py-2 text-sm border border-slate-300 rounded-xl" />
        <input id="q-email" type="email" placeholder="輸入申請時的 Gmail" class="px-3 py-2 text-sm border border-slate-300 rounded-xl" />
        <button id="btn-query" onclick="queryStudentOrders()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-xl text-sm">查詢紀錄</button>
      </div>
    </div>
    <div id="orders-list" class="space-y-4"></div>
  </section>

  <!-- ==================== 頁籤 3：歸還與異常回報 ==================== -->
  <section id="tab-return" class="hidden">
    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
      <h2 class="font-bold text-base mb-1">歸還確認與異常回報</h2>
      <p class="text-xs text-slate-500 mb-4">請先至「我的進度」查詢紀錄，系統會自動帶入你目前借用中的器材單。</p>
      <div id="return-empty" class="text-center py-10 text-slate-400 text-sm">目前沒有「借用中」的器材單</div>
      <div id="return-form-wrap" class="hidden space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">選擇要歸還的單號</label>
          <select id="ret-order-select" onchange="renderReturnChecklist()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white"></select>
        </div>

        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
          <p class="text-sm font-semibold mb-2">配件點檢確認（請逐項勾選）</p>
          <div id="ret-checklist" class="space-y-2 text-sm"></div>
        </div>

        <div>
          <p class="text-sm font-semibold mb-2">器材使用狀況</p>
          <div class="grid grid-cols-2 gap-3">
            <label class="border rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-green-600 has-[:checked]:bg-green-50">
              <input type="radio" name="ret-condition" value="normal" checked onchange="toggleIssueBox()" />
              <span class="text-sm font-medium">器材正常無損</span>
            </label>
            <label class="border rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50">
              <input type="radio" name="ret-condition" value="issue" onchange="toggleIssueBox()" />
              <span class="text-sm font-medium text-red-600">有異常／遺失</span>
            </label>
          </div>
        </div>

        <div id="issue-box" class="hidden bg-red-50 border border-red-200 p-4 rounded-xl space-y-3">
          <div>
            <label class="block text-sm font-medium text-red-800 mb-1">異常或遺失說明（必填）</label>
            <textarea id="ret-issue-desc" rows="2" placeholder="例如：腳架快拆板不見、鏡頭蓋破裂、無法開機..." class="w-full px-3 py-2 text-sm border border-red-300 rounded-xl bg-white"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-red-800 mb-1">拍攝異常部位照片</label>
            <input type="file" accept="image/*" capture="environment" onchange="handleReturnPhoto(event, 'issue')" class="text-xs w-full" />
            <img id="preview-issue" class="hidden mt-2 h-32 rounded-lg border object-cover" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">歸還全景存證照（必填，將自動壓上時間浮水印）</label>
          <input type="file" accept="image/*" capture="environment" onchange="handleReturnPhoto(event, 'return')" class="text-xs w-full" />
          <img id="preview-return" class="hidden mt-2 h-32 rounded-lg border object-cover" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">使用回饋或教室建議（選填）</label>
          <input id="ret-feedback" type="text" placeholder="任何使用上的建議都可以寫在這裡" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl" />
        </div>

        <button id="btn-submit-return" onclick="submitReturnForm()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm">
          送出歸還回報
        </button>
      </div>
    </div>
  </section>
</main>

<!-- 底部懸浮清單條（借用申請用） -->
<div id="cart-bar" class="hidden fixed bottom-16 md:bottom-4 left-4 right-4 max-w-5xl mx-auto bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between z-30">
  <div>
    <span class="text-xs text-slate-300">已選取器材</span>
    <p id="cart-summary-text" class="font-bold text-sm">0 項</p>
  </div>
  <button onclick="openCheckoutModal()" class="bg-blue-500 hover:bg-blue-400 text-white font-semibold px-4 py-2 rounded-xl text-sm">
    下一步：填寫資料
  </button>
</div>

<!-- 手機版底部固定導覽 -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 grid grid-cols-3 h-14 z-30">
  <button onclick="switchTab('apply')" id="nav-m-apply" class="text-xs font-semibold text-blue-600 flex flex-col items-center justify-center">借用申請</button>
  <button onclick="switchTab('status')" id="nav-m-status" class="text-xs font-medium text-slate-500 flex flex-col items-center justify-center">我的進度</button>
  <button onclick="switchTab('return')" id="nav-m-return" class="text-xs font-medium text-slate-500 flex flex-col items-center justify-center">歸還回報</button>
</nav>

<!-- 填寫申請資料 Modal -->
<div id="checkout-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-lg">填寫借用申請單</h3>
      <button onclick="closeModal('checkout-modal')" class="text-slate-400 text-xl">&times;</button>
    </div>
    <div id="checkout-items" class="bg-slate-50 p-3 rounded-xl mb-4 text-sm space-y-1.5"></div>
    <form id="apply-form" onsubmit="submitOrder(event)" class="space-y-3 text-sm">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block font-medium mb-1">班級 *</label><input name="class_name" required placeholder="例如：廣二辛" class="w-full px-3 py-2 border rounded-xl" /></div>
        <div><label class="block font-medium mb-1">學號 *</label><input name="student_id" required placeholder="輸入學號" class="w-full px-3 py-2 border rounded-xl" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block font-medium mb-1">姓名 *</label><input name="student_name" required placeholder="真實姓名，不要輸入學號" class="w-full px-3 py-2 border rounded-xl" /></div>
        <div><label class="block font-medium mb-1">聯絡電話 *</label><input name="phone" required placeholder="09xx-xxx-xxx" class="w-full px-3 py-2 border rounded-xl" /></div>
      </div>
      <div><label class="block font-medium mb-1">Gmail（接收老師核發時段通知）*</label><input name="email" type="email" required placeholder="example@gmail.com" class="w-full px-3 py-2 border rounded-xl" /></div>
      <div><label class="block font-medium mb-1">借用用途 *</label><input name="purpose" required placeholder="例如：期末專題外拍、校慶活動紀錄" class="w-full px-3 py-2 border rounded-xl" /></div>
      <div><label class="block font-medium mb-1">希望借用日期與方便取件時段 *</label><input name="wish_time" required placeholder="例如：12/05(五) 午休或第5節空堂" class="w-full px-3 py-2 border rounded-xl" /></div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeModal('checkout-modal')" class="w-1/3 py-2.5 border rounded-xl font-medium">返回修改</button>
        <button id="btn-submit-order" type="submit" class="w-2/3 py-2.5 bg-blue-600 text-white rounded-xl font-semibold">送出借用申請</button>
      </div>
    </form>
  </div>
</div>

<!-- 取件強制拍照存證 Modal -->
<div id="pickup-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5 space-y-4">
    <div class="flex justify-between items-center">
      <div>
        <h3 class="font-bold text-lg">現場取件：器材原貌存證</h3>
        <p class="text-xs text-slate-500">為保障雙方權益，須拍滿 2 張必拍照片（自動壓上時間浮水印）</p>
      </div>
      <button onclick="closeModal('pickup-modal')" class="text-slate-400 text-xl">&times;</button>
    </div>

    <div class="space-y-3 text-sm">
      <div class="border border-dashed border-blue-300 bg-blue-50/50 p-3.5 rounded-xl">
        <p class="font-semibold text-blue-900">1. 配件全景照（必填）</p>
        <p class="text-xs text-slate-600 mb-2">請將機身、鏡頭、電池、鏡頭蓋等全部攤開拍一張</p>
        <input type="file" accept="image/*" capture="environment" onchange="handlePickupPhoto(event, 0)" class="text-xs w-full" />
        <img id="pk-prev-0" class="hidden mt-2 h-36 w-full object-cover rounded-lg border" />
      </div>

      <div class="border border-dashed border-blue-300 bg-blue-50/50 p-3.5 rounded-xl">
        <p class="font-semibold text-blue-900">2. 關鍵部位特寫（必填）</p>
        <p class="text-xs text-slate-600 mb-2">請拍攝鏡頭前玉、機身螢幕或腳架雲台特寫</p>
        <input type="file" accept="image/*" capture="environment" onchange="handlePickupPhoto(event, 1)" class="text-xs w-full" />
        <img id="pk-prev-1" class="hidden mt-2 h-36 w-full object-cover rounded-lg border" />
      </div>

      <div class="border border-dashed border-slate-300 p-3.5 rounded-xl">
        <p class="font-semibold text-slate-700">3. 既有舊傷補充照（選填）</p>
        <p class="text-xs text-slate-500 mb-2">若領取當下發現已有刮痕或異常，請拍下自保</p>
        <input type="file" accept="image/*" capture="environment" onchange="handlePickupPhoto(event, 2)" class="text-xs w-full" />
        <img id="pk-prev-2" class="hidden mt-2 h-36 w-full object-cover rounded-lg border" />
      </div>
    </div>

    <button id="btn-confirm-pickup" disabled onclick="submitPickupPhotos()"
      class="w-full py-3 rounded-xl font-semibold text-sm bg-slate-300 text-slate-500 cursor-not-allowed transition-colors">
      完成存證並開始借用（尚缺必拍照片）
    </button>
  </div>
</div>

<script>
  let equipmentList = [];
  let cart = {}; // { id: qty }
  let activeCategory = '全部';
  let studentOrders = [];
  let currentPickupOrder = null;
  let pickupPhotos = [null, null, null];
  let returnPhotoB64 = null;
  let issuePhotoB64 = null;

  window.onload = () => {
    loadCatalog();
    document.getElementById('q-sid').value = localStorage.getItem('cam_sid') || '';
    document.getElementById('q-email').value = localStorage.getItem('cam_email') || '';
  };

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium text-white ${isError ? 'bg-red-600' : 'bg-slate-900'}`;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3200);
  }

  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

  function switchTab(tab) {
    ['apply', 'status', 'return'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
      document.getElementById('nav-d-' + t).className = t === tab
        ? 'px-4 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white'
        : 'px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100';
      document.getElementById('nav-m-' + t).className = t === tab
        ? 'text-xs font-semibold text-blue-600 flex flex-col items-center justify-center'
        : 'text-xs font-medium text-slate-500 flex flex-col items-center justify-center';
    });
    document.getElementById('cart-bar').classList.toggle('hidden', tab !== 'apply' || Object.keys(cart).length === 0);
    if (tab === 'status' && document.getElementById('q-sid').value && studentOrders.length === 0) queryStudentOrders();
    if (tab === 'return') setupReturnTab();
  }

  async function apiPost(payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '系統錯誤');
    return json.data;
  }

  // ==================== 1. 器材清單與點選 ====================
  async function loadCatalog() {
    try {
      const res = await fetch(API_URL + '?action=getPublicData');
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      equipmentList = json.data || [];
      document.getElementById('catalog-loading').classList.add('hidden');
      renderCategories();
      renderCatalog();
    } catch (e) {
      document.getElementById('catalog-loading').textContent = '載入失敗，請確認 API_URL 是否設定正確。';
    }
  }

  function renderCategories() {
    const cats = ['全部', ...new Set(equipmentList.map(i => i.category))];
    document.getElementById('category-bar').innerHTML = cats.map(c => `
      <button onclick="activeCategory='${c}';renderCategories();renderCatalog();"
        class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border ${activeCategory === c ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200'}">
        ${c}
      </button>`).join('');
  }

  function renderCatalog() {
    const kw = document.getElementById('search-input').value.trim().toLowerCase();
    const list = equipmentList.filter(i =>
      (activeCategory === '全部' || i.category === activeCategory) &&
      (!kw || i.name.toLowerCase().includes(kw))
    );

    document.getElementById('catalog-grid').innerHTML = list.map(it => {
      const qty = cart[it.id] || 0;
      const disabled = it.status !== '開放' || it.total_qty <= 0;
      const imgHtml = it.img_url
        ? `<img src="${it.img_url}" class="w-full h-32 object-cover bg-slate-100" />`
        : `<div class="w-full h-32 bg-slate-100 flex items-center justify-center text-slate-400 text-xs">${it.category}</div>`;

      return `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col justify-between shadow-sm">
          <div>
            ${imgHtml}
            <div class="p-3">
              <div class="flex items-center justify-between gap-1 mb-1">
                <span class="text-[11px] px-2 py-0.5 rounded-full ${disabled ? 'bg-slate-200 text-slate-500' : 'bg-green-100 text-green-700'}">
                  ${disabled ? '維修中' : '可預約 (' + it.available_qty + '/' + it.total_qty + ')'}
                </span>
              </div>
              <h3 class="font-bold text-sm leading-snug">${it.name}</h3>
              <p class="text-[11px] text-slate-500 mt-0.5 line-clamp-2">${it.note || ''}</p>
            </div>
          </div>
          <div class="p-3 pt-0">
            ${disabled
              ? `<button disabled class="w-full py-1.5 rounded-xl bg-slate-100 text-slate-400 text-xs font-medium">暫停借用</button>`
              : qty === 0
                ? `<button onclick="updateCart('${it.id}', 1)" class="w-full py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold">+ 加入清單</button>`
                : `<div class="flex items-center justify-between bg-blue-600 text-white rounded-xl px-2 py-1">
                     <button onclick="updateCart('${it.id}', -1)" class="w-7 h-6 font-bold">-</button>
                     <span class="text-xs font-bold">${qty}</span>
                     <button onclick="updateCart('${it.id}', 1)" class="w-7 h-6 font-bold">+</button>
                   </div>`
            }
          </div>
        </div>`;
    }).join('');
  }

  function updateCart(id, delta) {
    const item = equipmentList.find(i => i.id === id);
    const next = (cart[id] || 0) + delta;
    if (next <= 0) delete cart[id];
    else if (next <= item.total_qty) cart[id] = next;
    else showToast('已達該器材總數量上限', true);

    renderCatalog();
    const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
    document.getElementById('cart-summary-text').textContent = `${Object.keys(cart).length} 種器材，共 ${totalItems} 件`;
    document.getElementById('cart-bar').classList.toggle('hidden', totalItems === 0);
  }

  function openCheckoutModal() {
    document.getElementById('checkout-items').innerHTML = Object.keys(cart).map(id => {
      const it = equipmentList.find(i => i.id === id);
      return `<div class="flex justify-between"><span>${it.name}</span><span class="font-bold">x ${cart[id]}</span></div>`;
    }).join('');
    document.getElementById('checkout-modal').classList.remove('hidden');
  }

  async function submitOrder(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-order');
    btn.disabled = true; btn.textContent = '送出申請中...';
    const fd = new FormData(e.target);
    const items = Object.keys(cart).map(id => {
      const it = equipmentList.find(i => i.id === id);
      return { id: it.id, name: it.name, qty: cart[id] };
    });

    try {
      const data = await apiPost({
        action: 'submitOrder',
        class_name: fd.get('class_name'),
        student_id: fd.get('student_id'),
        student_name: fd.get('student_name'),
        phone: fd.get('phone'),
        email: fd.get('email'),
        purpose: fd.get('purpose'),
        wish_time: fd.get('wish_time'),
        items
      });
      localStorage.setItem('cam_sid', fd.get('student_id'));
      localStorage.setItem('cam_email', fd.get('email'));
      document.getElementById('q-sid').value = fd.get('student_id');
      document.getElementById('q-email').value = fd.get('email');

      cart = {};
      e.target.reset();
      closeModal('checkout-modal');
      renderCatalog();
      showToast(`申請成功！單號 ${data.order_id}，請靜候老師 Gmail 通知`);
      switchTab('status');
      queryStudentOrders();
    } catch (err) {
      showToast(err.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '送出借用申請';
    }
  }

  // ==================== 2. 進度查詢與取件拍照 ====================
  async function queryStudentOrders() {
    const sid = document.getElementById('q-sid').value.trim();
    const email = document.getElementById('q-email').value.trim();
    if (!sid || !email) return showToast('請輸入學號與 Gmail', true);

    const btn = document.getElementById('btn-query');
    btn.disabled = true; btn.textContent = '查詢中...';
    try {
      localStorage.setItem('cam_sid', sid);
      localStorage.setItem('cam_email', email);
      studentOrders = await apiPost({ action: 'getStudentOrders', student_id: sid, email });
      renderStudentOrders();
    } catch (err) {
      showToast(err.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '查詢紀錄';
    }
  }

  function renderStudentOrders() {
    const wrap = document.getElementById('orders-list');
    if (!studentOrders.length) {
      wrap.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">查無符合的借用紀錄</div>`;
      return;
    }

    const steps = ['待審核', '已核發待確認', '預約成立', '借用中', '已歸還'];
    wrap.innerHTML = studentOrders.map(o => {
      const stepIdx = steps.indexOf(o.status);
      let actionHtml = '';
      if (o.status === '待審核') {
        actionHtml = `<div class="flex justify-between items-center"><span class="text-xs text-slate-500">等待老師排程核發時段</span>
          <button onclick="cancelOrder('${o.order_id}')" class="text-xs px-3 py-1.5 border border-slate-300 rounded-lg text-slate-600">取消申請</button></div>`;
      } else if (o.status === '已核發待確認') {
        actionHtml = `<div class="flex gap-2">
          <button onclick="confirmSlot('${o.order_id}')" class="flex-1 py-2 bg-green-600 text-white rounded-xl text-xs font-semibold">確認此時段可配合</button>
          <button onclick="cancelOrder('${o.order_id}')" class="px-3 py-2 border border-slate-300 rounded-xl text-xs text-slate-600">無法配合(取消)</button></div>`;
      } else if (o.status === '預約成立') {
        actionHtml = `<button onclick="openPickupModal('${o.order_id}')" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold">現場取件：拍照存證</button>`;
      } else if (o.status === '借用中') {
        actionHtml = `<button onclick="switchTab('return')" class="w-full py-2.5 bg-slate-900 text-white rounded-xl text-sm font-semibold">前往歸還與異常回報</button>`;
      } else if (o.status === '已駁回') {
        actionHtml = `<div class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-xl">駁回原因：${o.reject_reason}</div>`;
      }

      return `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs text-slate-400">${o.order_id}</span>
              <h3 class="font-bold text-sm mt-0.5">${o.items_summary}</h3>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${o.status === '已駁回' || o.status === '已取消' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}">${o.status}</span>
          </div>

          ${stepIdx >= 0 ? `
          <div class="grid grid-cols-4 gap-1 text-[10px] text-center">
            ${['待審核', '核發時段', '借用中', '已歸還'].map((label, idx) => {
              const active = (idx === 0 && stepIdx >= 0) || (idx === 1 && stepIdx >= 1) || (idx === 2 && stepIdx >= 3) || (idx === 3 && stepIdx >= 4);
              return `<div class="py-1 rounded ${active ? 'bg-blue-600 text-white font-semibold' : 'bg-slate-100 text-slate-400'}">${label}</div>`;
            }).join('')}
          </div>` : ''}

          ${o.pickup_time ? `
          <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs space-y-1">
            <p><b>核發取件時間：</b>${o.pickup_time}</p>
            <p><b>規定歸還期限：</b>${o.return_time}</p>
            ${o.teacher_note ? `<p><b>老師備註：</b>${o.teacher_note}</p>` : ''}
          </div>` : ''}

          ${actionHtml}
        </div>`;
    }).join('');
  }

  async function cancelOrder(orderId) {
    if (!confirm('確定要取消這筆借用申請嗎？')) return;
    try {
      await apiPost({ action: 'cancelOrder', order_id: orderId, student_id: document.getElementById('q-sid').value.trim() });
      showToast('已取消申請');
      queryStudentOrders();
    } catch (e) { showToast(e.message, true); }
  }

  async function confirmSlot(orderId) {
    try {
      await apiPost({ action: 'confirmSlot', order_id: orderId, student_id: document.getElementById('q-sid').value.trim() });
      showToast('預約已成立！請於約定時間至教室拍照取件');
      queryStudentOrders();
    } catch (e) { showToast(e.message, true); }
  }

  // ==================== 圖片壓縮 + 浮水印核心 ====================
  function compressAndWatermark(file, tagText) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1280;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // 壓上右下角時間與單號浮水印
          const now = new Date();
          const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
          const text = `${ts} | ${tagText}`;
          const fontSize = Math.max(18, Math.round(canvas.width * 0.024));
          ctx.font = `bold ${fontSize}px sans-serif`;
          const textW = ctx.measureText(text).width;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
          ctx.fillRect(canvas.width - textW - 24, canvas.height - fontSize - 22, textW + 16, fontSize + 14);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(text, canvas.width - textW - 16, canvas.height - 14);

          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function openPickupModal(orderId) {
    currentPickupOrder = studentOrders.find(o => o.order_id === orderId);
    pickupPhotos = [null, null, null];
    [0, 1, 2].forEach(i => document.getElementById('pk-prev-' + i).classList.add('hidden'));
    updatePickupBtnState();
    document.getElementById('pickup-modal').classList.remove('hidden');
  }

  async function handlePickupPhoto(e, idx) {
    const file = e.target.files[0];
    if (!file) return;
    showToast('照片壓縮與浮水印處理中...');
    const b64 = await compressAndWatermark(file, `${currentPickupOrder.order_id} | ${currentPickupOrder.student_id}`);
    pickupPhotos[idx] = b64;
    const prev = document.getElementById('pk-prev-' + idx);
    prev.src = b64;
    prev.classList.remove('hidden');
    updatePickupBtnState();
  }

  function updatePickupBtnState() {
    const btn = document.getElementById('btn-confirm-pickup');
    const ready = pickupPhotos[0] && pickupPhotos[1];
    btn.disabled = !ready;
    btn.className = ready
      ? 'w-full py-3 rounded-xl font-semibold text-sm bg-blue-600 hover:bg-blue-700 text-white'
      : 'w-full py-3 rounded-xl font-semibold text-sm bg-slate-300 text-slate-500 cursor-not-allowed';
    btn.textContent = ready ? '完成存證並開始借用' : '完成存證並開始借用（尚缺必拍照片）';
  }

  async function submitPickupPhotos() {
    const btn = document.getElementById('btn-confirm-pickup');
    btn.disabled = true; btn.textContent = '上傳存證照中，請稍候...';
    try {
      await apiPost({
        action: 'completePickup',
        order_id: currentPickupOrder.order_id,
        student_id: currentPickupOrder.student_id,
        photos: pickupPhotos.filter(Boolean)
      });
      closeModal('pickup-modal');
      showToast('存證完成！祝拍攝順利');
      queryStudentOrders();
    } catch (e) {
      showToast(e.message, true);
      btn.disabled = false; btn.textContent = '完成存證並開始借用';
    }
  }

  // ==================== 3. 歸還與異常回報 ====================
  function setupReturnTab() {
    const active = studentOrders.filter(o => o.status === '借用中');
    document.getElementById('return-empty').classList.toggle('hidden', active.length > 0);
    document.getElementById('return-form-wrap').classList.toggle('hidden', active.length === 0);
    if (!active.length) return;

    document.getElementById('ret-order-select').innerHTML = active.map(o =>
      `<option value="${o.order_id}">${o.order_id} - ${o.items_summary}</option>`
    ).join('');
    renderReturnChecklist();
  }

  function renderReturnChecklist() {
    const oid = document.getElementById('ret-order-select').value;
    const order = studentOrders.find(o => o.order_id === oid);
    const items = JSON.parse(order.items_json || '[]');
    document.getElementById('ret-checklist').innerHTML = items.map(it => `
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" class="ret-chk w-4 h-4 rounded" />
        <span>${it.name} x ${it.qty}（含配件皆已清點）</span>
      </label>`).join('');
  }

  function toggleIssueBox() {
    const isIssue = document.querySelector('input[name="ret-condition"]:checked').value === 'issue';
    document.getElementById('issue-box').classList.toggle('hidden', !isIssue);
  }

  async function handleReturnPhoto(e, type) {
    const file = e.target.files[0];
    if (!file) return;
    const oid = document.getElementById('ret-order-select').value;
    const sid = document.getElementById('q-sid').value.trim();
    const b64 = await compressAndWatermark(file, `歸還 ${oid} | ${sid}`);
    if (type === 'return') {
      returnPhotoB64 = b64;
      const p = document.getElementById('preview-return'); p.src = b64; p.classList.remove('hidden');
    } else {
      issuePhotoB64 = b64;
      const p = document.getElementById('preview-issue'); p.src = b64; p.classList.remove('hidden');
    }
  }

  async function submitReturnForm() {
    const chks = [...document.querySelectorAll('.ret-chk')];
    if (chks.some(c => !c.checked)) return showToast('請先勾選確認所有歸還配件', true);
    if (!returnPhotoB64) return showToast('請先拍攝歸還全景存證照', true);

    const hasIssue = document.querySelector('input[name="ret-condition"]:checked').value === 'issue';
    const issueDesc = document.getElementById('ret-issue-desc').value.trim();
    if (hasIssue && !issueDesc) return showToast('請填寫異常或遺失說明', true);

    const btn = document.getElementById('btn-submit-return');
    btn.disabled = true; btn.textContent = '上傳歸還資料中...';
    try {
      await apiPost({
        action: 'submitReturn',
        order_id: document.getElementById('ret-order-select').value,
        student_id: document.getElementById('q-sid').value.trim(),
        has_issue: hasIssue,
        issue_desc: issueDesc,
        feedback: document.getElementById('ret-feedback').value.trim(),
        return_photos: [returnPhotoB64],
        issue_photos: issuePhotoB64 ? [issuePhotoB64] : []
      });
      returnPhotoB64 = null; issuePhotoB64 = null;
      showToast('已送出歸還回報！請將器材交給老師完成點收');
      switchTab('status');
      queryStudentOrders();
    } catch (e) {
      showToast(e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '送出歸還回報';
    }
  }
</script>
</body>
</html>
